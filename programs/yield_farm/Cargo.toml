[package]
name = "yield_farm"
version = "0.1.0"
description = "$PROFIT yield farming — stake tokens, earn tiered rewards, back binary market liquidity"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "yield_farm"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
